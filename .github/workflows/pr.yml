name: Pull Request

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: |
          npm run format
          if ! git diff --quiet; then
            echo "❌ Formatting issues found. Please run 'npm run format' locally and commit the changes."
            git diff --name-only
            exit 1
          fi
          echo "✅ No formatting issues found"

      - name: Run linting
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Check package sizes
        run: |
          echo "## 📦 Package Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "packages/power-platform-playwright-toolkit/dist" ]; then
            toolkit_size=$(du -sh packages/power-platform-playwright-toolkit/dist | cut -f1)
            echo "- **power-platform-playwright-toolkit**: \`$toolkit_size\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "packages/docs/.next" ]; then
            docs_size=$(du -sh packages/docs/.next | cut -f1)
            echo "- **docs**: \`$docs_size\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          count="$(git diff --name-only "origin/${BASE_REF}...HEAD" | wc -l | tr -d ' ')"
          echo "modified_files=${count}" >> "$GITHUB_OUTPUT"

      - name: PR summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_ACTOR: ${{ github.actor }}
          MODIFIED_FILES: ${{ steps.changes.outputs.modified_files }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo ""
            echo "---"
            echo "## 🔍 Pull Request Validation"
            echo ""
            echo "### PR Details"
            echo "- **Branch**: \`${HEAD_REF}\` → \`${BASE_REF}\`"
            echo "- **Author**: @${PR_ACTOR}"
            echo "- **Modified files**: ${MODIFIED_FILES}"
            echo ""
            echo "### Validation Results"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${JOB_STATUS}" = "success" ]; then
            {
              echo "✅ All validation checks passed"
              echo ""
              echo "- ✅ Code formatting"
              echo "- ✅ Linting"
              echo "- ✅ Build"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ Some validation checks failed"
              echo ""
              echo "Please fix the issues and push again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "---"
            echo "💡 **Note**: Playwright tests are not run automatically. Use the [Playwright Tests workflow](../../actions/workflows/playwright-tests.yml) to run tests manually."
          } >> "$GITHUB_STEP_SUMMARY"
