name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'packages/docs/**'
      - 'packages/power-platform-playwright-toolkit/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: |
          npm run format
          if ! git diff --quiet; then
            echo "❌ Formatting issues found. Please run 'npm run format' locally and commit the changes."
            git diff --name-only
            exit 1
          fi
          echo "✅ No formatting issues found"

      - name: Run linting
        run: npm run lint

      - name: Build toolkit
        run: npm run build:toolkit

      - name: Generate API documentation
        run: |
          cd packages/power-platform-playwright-toolkit
          npm run docs

      - name: Build documentation site
        run: |
          cd packages/docs
          NEXT_PUBLIC_BASE_PATH=/power-platform-playwright-samples npm run build

      - name: Check package sizes
        run: |
          echo "## 📦 Package Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "packages/power-platform-playwright-toolkit/dist" ]; then
            toolkit_size=$(du -sh packages/power-platform-playwright-toolkit/dist | cut -f1)
            echo "- **power-platform-playwright-toolkit**: \`$toolkit_size\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "packages/docs/out" ]; then
            docs_out_size=$(du -sh packages/docs/out | cut -f1)
            echo "- **docs (static export)**: \`$docs_out_size\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./packages/docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
