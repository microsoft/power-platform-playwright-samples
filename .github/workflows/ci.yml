name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: |
          npm run format
          if ! git diff --quiet; then
            echo "❌ Formatting issues found. Please run 'npm run format' locally and commit the changes."
            git diff --name-only
            exit 1
          fi
          echo "✅ No formatting issues found"

      - name: Run linting
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Check package sizes
        run: |
          echo "## 📦 Package Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "packages/power-platform-playwright-toolkit/dist" ]; then
            toolkit_size=$(du -sh packages/power-platform-playwright-toolkit/dist | cut -f1)
            echo "- **power-platform-playwright-toolkit**: \`$toolkit_size\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "packages/docs/.next" ]; then
            docs_size=$(du -sh packages/docs/.next | cut -f1)
            echo "- **docs**: \`$docs_size\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build summary
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo ""
            echo "---"
            echo "## 🏗️ Build Results"
            echo ""
            echo "- **Branch**: \`${REF_NAME}\`"
            echo "- **Commit**: \`${COMMIT_SHA}\`"
            echo "- **Triggered by**: ${EVENT_NAME}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${JOB_STATUS}" = "success" ]; then
            {
              echo "✅ All checks passed successfully"
              echo ""
              echo "- ✅ Code formatting"
              echo "- ✅ Linting"
              echo "- ✅ Build"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some checks failed" >> "$GITHUB_STEP_SUMMARY"
          fi
